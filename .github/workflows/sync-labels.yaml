# Install this in .github/workflows/ to automate label updates
name: Sync Labels

on:
  workflow_dispatch:
    # Allows for manual triggering.
    inputs:
      dry_run:
        description: "If true, don't make any actual changes"
        required: false
        default: false
  schedule:
    # Run every week on Sunday at 5:42 AM.
    - cron: '42 5 * * 0'

jobs:
  sync-labels:
    runs-on: ubuntu-latest

    permissions:
      # "Write" to Issues to manage labels for the repo
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: shaka-project/shaka-github-tools
          persist-credentials: false

      # TODO: revert to micnncim and new release after landing
      #       https://github.com/micnncim/action-label-syncer/pull/68
      - uses: joeyparrish/action-label-syncer@v1.8.0
        with:
          dry_run: ${{ github.event.inputs.dry_run || false }}
          prune: true
          # This repo does not have a repo-specific manifest in shaka-github-tools.
          # Use the shared common label set until an upstream 2ndlifeinc config exists.
          manifest: sync-labels/configs/common/common.yaml
          repository: ${{ github.repository }}
          token: ${{ github.token }}
