name: Release

# Runs on a new tag. Builds all platforms (including win-arm64 cross) and
# deposits UNSIGNED binaries into MinIO at releases/ffmpeg/<tag>/unsigned/.
# Signing and signed-binary publishing is handled by a separate workflow in
# the youtuboost_desktop repo (ffmpeg-sign-publish.yml) that pulls from
# MinIO and pushes signed binaries back to releases/ffmpeg/<tag>/signed/.
on:
  push:
    tags:
      - "*"

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    with:
      ref: ${{ github.ref }}
      version: ${{ github.ref_name }}
    secrets: inherit

  build_winarm64:
    uses: ./.github/workflows/build-winarm64.yaml
    with:
      ref: ${{ github.ref }}
      version: ${{ github.ref_name }}
    secrets: inherit

  summary:
    name: Release summary
    needs: [build, build_winarm64]
    runs-on: ubuntu-latest
    steps:
      - name: Record unsigned upload location
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -e
          echo "### Unsigned binaries uploaded" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "MinIO path: \`releases/ffmpeg/$VERSION/unsigned/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Next step: run \`ffmpeg-sign-publish\` workflow in 2ndlifeinc/youtuboost_desktop with version=\`$VERSION\`." >> "$GITHUB_STEP_SUMMARY"
