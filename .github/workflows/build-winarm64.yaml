name: Build win-arm64 (cross)

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        description: "Release version label used in MinIO path (releases/ffmpeg/<version>/unsigned/*). Falls back to ref_name (tag) or dev-<sha7>."
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: "Release version label used in MinIO path (releases/ffmpeg/<version>/unsigned/*). Falls back to ref_name (tag) or dev-<sha7>."
        required: false
        type: string
        default: ""

defaults:
  run:
    shell: bash

jobs:
  build-winarm64:
    runs-on: [self-hosted, Linux, X64]
    container:
      image: mstorsjo/llvm-mingw:latest
      options: --user root
    steps:
      - uses: actions/checkout@v6
        with:
          path: repo-src
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Install build prerequisites
        run: |
          set -ex
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf automake build-essential ca-certificates cmake curl git \
            libtool make meson ninja-build nasm pkg-config python3-pip yasm

      - name: Cross-build ffmpeg + deps for win-arm64
        env:
          REPO_SRC: ${{ github.workspace }}/repo-src
          OUT_DIR: ${{ github.workspace }}/out
        run: bash "$REPO_SRC/build-scripts/cross-winarm64.sh"

      - name: Report versions
        run: ls -la out && file out/*.exe || true

      - name: Install mc (MinIO client)
        run: |
          set -ex
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://dl.min.io/client/mc/release/linux-amd64/mc" \
            -o "$HOME/.local/bin/mc"
          chmod +x "$HOME/.local/bin/mc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mc" --version

      - name: Upload unsigned binaries to MinIO
        env:
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -ex
          VERSION="$INPUT_VERSION"
          if [[ -z "$VERSION" ]]; then
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              VERSION="$GITHUB_REF_NAME"
            else
              VERSION="dev-${GITHUB_SHA::7}"
            fi
          fi
          mc alias set minio "$S3_ENDPOINT_URL" "$S3_ACCESS_KEY" "$S3_SECRET_KEY"
          DEST="minio/releases/ffmpeg/$VERSION/unsigned"
          mc cp "out/ffmpeg-win-arm64.exe"  "$DEST/ffmpeg-win-arm64.exe"
          mc cp "out/ffprobe-win-arm64.exe" "$DEST/ffprobe-win-arm64.exe"
          mc ls "$DEST/"
