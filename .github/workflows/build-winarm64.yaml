name: Build win-arm64 (cross)

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      base_version:
        description: "ffmpeg upstream semver, e.g. 8.0.1. Used as first MinIO path segment."
        required: false
        type: string
        default: "8.0.1"
      variant:
        description: "Codec/date variant slug, e.g. 20260422-libdav1d-libaom. Full MinIO path: releases/ffmpeg/<base_version>/<variant>/unsigned/*. Falls back to ref_name (tag) or dev-<YYYYMMDD>-<sha7>."
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      base_version:
        description: "ffmpeg upstream semver, e.g. 8.0.1. Used as first MinIO path segment."
        required: false
        type: string
        default: "8.0.1"
      variant:
        description: "Codec/date variant slug, e.g. 20260422-libdav1d-libaom. Full MinIO path: releases/ffmpeg/<base_version>/<variant>/unsigned/*. Falls back to ref_name (tag) or dev-<YYYYMMDD>-<sha7>."
        required: false
        type: string
        default: ""

defaults:
  run:
    shell: bash

jobs:
  build-winarm64:
    # May 2026 state: this special cross-build stays on self-hosted Linux x64; do not normalize it to macos-or-linux or GitHub-hosted runners without revalidating the container/toolchain.
    runs-on: [self-hosted, Linux, X64]
    container:
      image: mstorsjo/llvm-mingw:latest
      options: --user root
    steps:
      - uses: actions/checkout@v6
        with:
          path: repo-src
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Install build prerequisites
        run: |
          set -ex
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf automake build-essential ca-certificates cmake curl git \
            libtool make meson ninja-build nasm pkg-config python3-pip yasm

      - name: Cross-build ffmpeg + deps for win-arm64
        env:
          REPO_SRC: ${{ github.workspace }}/repo-src
          OUT_DIR: ${{ github.workspace }}/out
        run: bash "$REPO_SRC/cross-scripts/winarm64.sh"

      - name: Report versions
        run: ls -la out && file out/*.exe || true

      - name: Install mc (MinIO client)
        run: |
          set -ex
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://dl.min.io/client/mc/release/linux-amd64/mc" \
            -o "$HOME/.local/bin/mc"
          chmod +x "$HOME/.local/bin/mc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/mc" --version

      - name: Upload unsigned binaries to MinIO
        env:
          S3_ENDPOINT_URL: ${{ vars.S3_ENDPOINT_URL }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          INPUT_BASE_VERSION: ${{ inputs.base_version }}
          INPUT_VARIANT: ${{ inputs.variant }}
        run: |
          set -e
          BASE_VERSION="${INPUT_BASE_VERSION:-8.0.1}"
          VARIANT="$INPUT_VARIANT"
          if [[ -z "$VARIANT" ]]; then
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              VARIANT="$GITHUB_REF_NAME"
            else
              VARIANT="dev-$(date +%Y%m%d)-${GITHUB_SHA::7}"
            fi
          fi
          mc alias set ci "$S3_ENDPOINT_URL" "$S3_ACCESS_KEY" "$S3_SECRET_KEY"
          DEST="ci/releases/ffmpeg/$BASE_VERSION/$VARIANT/unsigned"
          [[ -f out/ffmpeg-win-arm64.exe ]] || { echo "::error::ffmpeg-win-arm64.exe missing"; exit 1; }
          [[ -f out/ffprobe-win-arm64.exe ]] || { echo "::error::ffprobe-win-arm64.exe missing"; exit 1; }
          mc cp "out/ffmpeg-win-arm64.exe"  "$DEST/ffmpeg-win-arm64.exe"
          mc cp "out/ffprobe-win-arm64.exe" "$DEST/ffprobe-win-arm64.exe"
          mc ls "$DEST/"
